name: CI

# Every pull request and every push to main: the API, both portals and the
# end-to-end suite must pass before anything reaches Vercel.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Development/Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Development/Backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          GM_NO_OLD_API: '1'

  portals:
    name: ${{ matrix.app }} portal (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [Admin, Partner]
    defaults:
      run:
        working-directory: Development/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Development/${{ matrix.app }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build

  e2e:
    name: End-to-end (API + both portals in a browser)
    runs-on: ubuntu-latest
    needs: [api, portals]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          (cd Development/Backend && npm ci --no-audit --no-fund && npm run build)
          (cd Development/Admin && npm ci --ignore-scripts --no-audit --no-fund)
          (cd Development/Partner && npm ci --ignore-scripts --no-audit --no-fund)
          (cd Development/E2E && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
      - name: Build the portals against the local API
        run: |
          (cd Development/Admin && VITE_MSW_ENABLED=false VITE_API_BASE_URL=http://localhost:4000/admin VITE_AUTH_MODE=api npm run build)
          (cd Development/Partner && VITE_ENABLE_MOCKS=false VITE_API_BASE_URL=http://localhost:4000/partner VITE_AUTH_MODE=api npm run build)
      - name: Start the API and both portals
        run: |
          (cd Development/Backend && JWT_SECRET=ci-only-secret-ci-only-secret DATA_DIR=$RUNNER_TEMP/gm node dist/main.js > $RUNNER_TEMP/api.log 2>&1 &)
          (cd Development/Admin && npx vite preview --port 5173 --strictPort > /dev/null 2>&1 &)
          (cd Development/Partner && npx vite preview --port 5174 --strictPort > /dev/null 2>&1 &)
          for i in $(seq 1 90); do curl -sf http://localhost:4000/health > /dev/null && curl -sf http://localhost:5173 > /dev/null && curl -sf http://localhost:5174 > /dev/null && exit 0; sleep 2; done
          cat $RUNNER_TEMP/api.log; exit 1
      - name: Run the suite
        working-directory: Development/E2E
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: Development/E2E/playwright-report
          retention-days: 14
