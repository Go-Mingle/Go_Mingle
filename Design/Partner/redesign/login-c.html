<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Login option C - Tonight&#x27;s floor (light)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Manrope:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B92E1C}a:hover{color:#8F2213}
.c-t{position:absolute;opacity:0;animation:c-in .6s cubic-bezier(.2,0,0,1) forwards}
.c-g{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:c-pop .45s cubic-bezier(.34,1.56,.64,1) forwards}
.c-card{opacity:0;transform:translateY(14px);animation:c-up .7s cubic-bezier(.2,0,0,1) .5s forwards}
.c-chip{opacity:0;animation:c-chip 4s ease-in-out forwards}
@keyframes c-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes c-pop{to{transform:scale(1)}}
@keyframes c-up{to{opacity:1;transform:none}}
@keyframes c-chip{0%{opacity:0;transform:translateY(6px)}15%,80%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.c-t,.c-g,.c-card{animation:none;opacity:1;transform:none}.c-chip{display:none}}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #D63A25;outline-offset:2px}
</style>
</head>
<body>
<div style="width:1440px;height:900px;position:relative;overflow:hidden;background:#F7F5FC;background-image:radial-gradient(#E6E2F0 1.2px,transparent 1.2px);background-size:28px 28px;color:#1A1530;font-family:Manrope,sans-serif">

  <svg class="c-t" style="left:90px;top:120px;animation-delay:.1s" width="150" height="150" viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="34" fill="#FFFFFF" stroke="#E8432E" stroke-width="5"></circle><circle class="c-g" style="animation-delay:.9s" cx="75" cy="20" r="11" fill="#D98A12"></circle><circle class="c-g" style="animation-delay:1.1s" cx="130" cy="75" r="11" fill="#13A386"></circle><circle class="c-g" style="animation-delay:1.3s" cx="75" cy="130" r="11" fill="#D98A12"></circle><circle class="c-g" style="animation-delay:1.5s" cx="20" cy="75" r="11" fill="#13A386"></circle></svg>
  <svg class="c-t" style="left:250px;top:560px;animation-delay:.3s" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="26" fill="#FFFFFF" stroke="#E8432E" stroke-width="5"></circle><circle class="c-g" style="animation-delay:1.6s" cx="60" cy="16" r="11" fill="#D98A12"></circle><circle class="c-g" style="animation-delay:1.9s" cx="60" cy="104" r="11" fill="#13A386"></circle></svg>
  <svg class="c-t" style="left:1180px;top:110px;animation-delay:.2s" width="190" height="190" viewBox="0 0 190 190" aria-hidden="true"><circle cx="95" cy="95" r="46" fill="#FFFFFF" stroke="#E8432E" stroke-width="5"></circle><circle class="c-g" style="animation-delay:1s" cx="95" cy="22" r="11" fill="#D98A12"></circle><circle class="c-g" style="animation-delay:1.2s" cx="158" cy="58" r="11" fill="#13A386"></circle><circle class="c-g" style="animation-delay:1.4s" cx="158" cy="132" r="11" fill="#D98A12"></circle><circle cx="95" cy="168" r="10" fill="none" stroke="#D98A12" stroke-width="2.5"></circle><circle class="c-g" style="animation-delay:1.8s" cx="32" cy="132" r="11" fill="#13A386"></circle><circle cx="32" cy="58" r="10" fill="none" stroke="#D98A12" stroke-width="2.5"></circle></svg>
  <svg class="c-t" style="left:1110px;top:540px;animation-delay:.4s" width="240" height="240" viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="62" fill="#FFFFFF" stroke="#E8432E" stroke-width="5"></circle><circle class="c-g" style="animation-delay:1.3s" cx="120" cy="24" r="11" fill="#D98A12"></circle><circle class="c-g" style="animation-delay:1.5s" cx="188" cy="52" r="11" fill="#13A386"></circle><circle class="c-g" style="animation-delay:1.7s" cx="216" cy="120" r="11" fill="#D98A12"></circle><circle cx="188" cy="188" r="10" fill="none" stroke="#D98A12" stroke-width="2.5"></circle><circle cx="120" cy="216" r="10" fill="none" stroke="#D98A12" stroke-width="2.5"></circle><circle class="c-g" style="animation-delay:2.1s" cx="52" cy="188" r="11" fill="#13A386"></circle><circle cx="24" cy="120" r="10" fill="none" stroke="#D98A12" stroke-width="2.5"></circle><circle class="c-g" style="animation-delay:2.3s" cx="52" cy="52" r="11" fill="#D98A12"></circle></svg>
  <svg class="c-t" style="left:60px;top:360px;animation-delay:.5s" width="110" height="110" viewBox="0 0 110 110" aria-hidden="true"><rect x="25" y="25" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#E8432E" stroke-width="5"></rect><circle class="c-g" style="animation-delay:2s" cx="55" cy="10" r="10" fill="#13A386"></circle><circle cx="55" cy="100" r="9" fill="none" stroke="#D98A12" stroke-width="2.5"></circle></svg>

  <span class="c-chip" style="position:absolute;left:1210px;top:330px;padding:6px 12px;border-radius:999px;background:#FFFFFF;border:1px solid #E6E2F0;font-size:12px;font-weight:700;color:#0B7A64;animation-delay:1.9s;box-shadow:0 6px 16px rgba(26,21,48,.08)">Hamza took a seat</span>
  <span class="c-chip" style="position:absolute;left:110px;top:280px;padding:6px 12px;border-radius:999px;background:#FFFFFF;border:1px solid #E6E2F0;font-size:12px;font-weight:700;color:#8A4F00;animation-delay:2.6s;box-shadow:0 6px 16px rgba(26,21,48,.08)">Table for 4 is full</span>

  <div style="position:absolute;top:32px;left:40px;font-family:Unbounded,sans-serif;font-weight:700;font-size:22px">GoMingle</div>
  <div role="group" aria-label="Theme" style="position:absolute;top:24px;right:32px;display:flex;gap:4px;padding:4px;border-radius:999px;background:#FFFFFF;border:1px solid #E6E2F0"><span aria-current="true" style="width:40px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#D63A25;color:#FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span><a href="#" aria-label="Dark theme" style="width:40px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#5C5677"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"></path></svg></a></div>

  <div style="position:absolute;left:470px;top:140px;width:500px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center">
    <span style="padding:6px 14px;border-radius:999px;background:#FFECE8;color:#B92E1C;font-size:13px;font-weight:700">This table is reserved for you</span>
    <h1 style="margin:0;font-family:Unbounded,sans-serif;font-weight:700;font-size:36px;line-height:1.15">Tonight's floor is filling up.</h1>
    <div class="c-card" style="width:100%;box-sizing:border-box;padding:30px;border-radius:28px;background:#FFFFFF;border:5px solid #E8432E;box-shadow:0 30px 70px rgba(26,21,48,.12);display:flex;flex-direction:column;gap:14px;text-align:left">
      <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600">Work email<input type="email" placeholder="you@restaurant.pk" style="height:48px;border-radius:12px;border:1px solid #D9D4E8;background:#F7F5FC;color:#1A1530;padding:0 14px;font:inherit;font-size:15px"></label>
      <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600">Password<input type="password" placeholder="Your password" style="height:48px;border-radius:12px;border:1px solid #D9D4E8;background:#F7F5FC;color:#1A1530;padding:0 14px;font:inherit;font-size:15px"></label>
      <button type="button" style="height:52px;border:0;border-radius:12px;background:#D63A25;color:#FFFFFF;font:inherit;font-weight:800;font-size:16px;cursor:pointer">Sign in</button>
      <div style="display:flex;justify-content:space-between;font-size:13px"><a href="#">Forgot password?</a><a href="#">Continue with Google</a></div>
    </div>
  </div>
</div>
</body>
</html>
