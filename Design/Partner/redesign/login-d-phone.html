<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Login option D - Phone (light)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B92E1C;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:radial-gradient(420px 360px at 50% 18%,#FFE9E2 0%,#F7F5FC 70%);color:#1A1530;font-family:Manrope,sans-serif;padding:20px 20px 24px;display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:Unbounded,sans-serif;font-weight:700;font-size:18px">GoMingle</span><span style="display:flex;gap:4px;padding:3px;border-radius:999px;background:#FFF;border:1px solid #E6E2F0"><span style="width:34px;height:30px;border-radius:999px;background:#D63A25"></span><span style="width:34px;height:30px"></span></span></div>
  <section style="display:flex;align-items:center;gap:14px;padding-top:6px">
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" style="flex-shrink:0"><circle cx="32" cy="32" r="14" fill="none" stroke="#D63A25" stroke-width="5"></circle><circle cx="32" cy="7" r="4.6" fill="#D98A12"></circle><circle cx="53.7" cy="19.5" r="4.6" fill="#13A386"></circle><circle cx="53.7" cy="44.5" r="4.6" fill="#D98A12"></circle><circle cx="32" cy="57" r="4.6" fill="#13A386"></circle><circle cx="10.3" cy="44.5" r="4.6" fill="#D98A12"></circle><circle cx="10.3" cy="19.5" r="3.8" fill="none" stroke="#D98A12" stroke-width="2"></circle></svg>
    <h1 style="margin:0;font-family:Unbounded,sans-serif;font-weight:700;font-size:22px;line-height:1.2"><span style="color:#0B7A64">Qawwali fans.</span><br>Tonight, at one table.</h1>
  </section>
  <div style="box-sizing:border-box;padding:22px;border-radius:22px;background:#FFF;border:1px solid #E6E2F0;box-shadow:0 20px 50px rgba(26,21,48,.1);display:flex;flex-direction:column;gap:14px">
    <div><div style="font-size:21px;font-weight:800">Welcome back</div><div style="font-size:13px;color:#5C5677;margin-top:2px">GoMingle Partner Portal</div></div>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#5C5677">EMAIL<input placeholder="you@yourrestaurant.com" style="height:46px;border-radius:12px;border:1px solid #D9D4E8;background:#F7F5FC;padding:0 14px;font:inherit;font-size:15px;letter-spacing:0"></label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#5C5677">PASSWORD<input type="password" placeholder="Enter your password" style="height:46px;border-radius:12px;border:1px solid #D9D4E8;background:#F7F5FC;padding:0 14px;font:inherit;font-size:15px;letter-spacing:0"></label>
    <div style="display:flex;justify-content:flex-end;font-size:13px"><a href="#">Forgot password?</a></div>
    <button type="button" style="height:50px;border:0;border-radius:12px;background:#D63A25;color:#FFF;font:inherit;font-weight:800;font-size:16px">Sign in</button>
    <button type="button" style="height:46px;border-radius:12px;border:1px solid #D9D4E8;background:transparent;font:inherit;font-weight:700;font-size:14px">Continue with Google</button>
    <div style="text-align:center;font-size:13px;color:#5C5677">New to GoMingle? <a href="#">Sign up</a></div>
  </div>
</div>
</body>
</html>
