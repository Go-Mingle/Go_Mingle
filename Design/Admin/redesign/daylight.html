<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>B - Daylight Social (parked)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5236E8}a:hover{color:#3A22C2}
.gb-chair{transform-box:fill-box;transform-origin:center;animation:gb-in 4.5s cubic-bezier(.34,1.56,.64,1) infinite}
.gb-c1{--dx:0;--dy:-14px}.gb-c2{--dx:14px;--dy:0;animation-delay:.12s}.gb-c3{--dx:0;--dy:14px;animation-delay:.24s}.gb-c4{--dx:-14px;--dy:0;animation-delay:.36s}
.gb-table{transform-box:fill-box;transform-origin:center;animation:gb-table 4.5s cubic-bezier(.2,0,0,1) infinite}
.gb-load .gb-chair{animation-duration:1.8s}
@keyframes gb-in{0%,8%{transform:translate(var(--dx),var(--dy));opacity:0}24%,86%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes gb-table{0%{transform:scale(.6);opacity:0}12%,90%{transform:scale(1);opacity:1}100%{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.gb-chair,.gb-table{animation:none}}
input:focus-visible,button:focus-visible{outline:2px solid #5236E8;outline-offset:2px}
</style>
</head>
<body>
<div style="width:1280px;height:820px;box-sizing:border-box;background:#F3F4FA;color:#1B1438;font-family:Figtree,sans-serif;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;padding:24px">
  <div style="padding:40px 44px;border-radius:32px;background:#FF6A2B;display:flex;flex-direction:column;gap:28px;color:#1B1438">
    <div style="display:flex;align-items:center;gap:1px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:32px">
      <span>G</span>
      <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="14" fill="#1B1438"></circle><rect x="25" y="2" width="14" height="9" rx="4.5" fill="#1B1438"></rect><rect x="53" y="25" width="9" height="14" rx="4.5" fill="#1B1438"></rect><rect x="25" y="53" width="14" height="9" rx="4.5" fill="#1B1438"></rect><rect x="2" y="25" width="9" height="14" rx="4.5" fill="#1B1438"></rect></svg>
      <span>Mingle</span>
    </div>
    <div style="display:flex;align-items:center;gap:40px;flex-grow:1">
      <svg width="240" height="240" viewBox="0 0 64 64" role="img" aria-label="GoMingle mark: four chairs pulled up to a round table">
        <circle class="gb-table" cx="32" cy="32" r="14" fill="#1B1438"></circle>
        <rect class="gb-chair gb-c1" x="25" y="2" width="14" height="9" rx="4.5" fill="#FFFFFF"></rect>
        <rect class="gb-chair gb-c2" x="53" y="25" width="9" height="14" rx="4.5" fill="#6B4EFF"></rect>
        <rect class="gb-chair gb-c3" x="25" y="53" width="14" height="9" rx="4.5" fill="#FFFFFF"></rect>
        <rect class="gb-chair gb-c4" x="2" y="25" width="9" height="14" rx="4.5" fill="#6B4EFF"></rect>
      </svg>
      <div style="display:flex;flex-direction:column;gap:14px;max-width:320px">
        <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px;line-height:1.02">Pull up a chair. Someone saved it for you.</h1>
        <p style="margin:0;font-size:17px;line-height:1.55">Four chairs slide up to the O whenever the app loads: a table filling up is the whole product in one second.</p>
      </div>
    </div>
  </div>
  
</div>
</body>
</html>
